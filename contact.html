<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact - TUPM Food Spots</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
  <div class="site-brand">
    <h1>TUPM Food Spots</h1>
    <p>Your guide to the best eats in and around TUP Manila.</p>
  </div>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

  <main>
    <section>
      <h2>Get in Touch</h2>
      <p>Got a food spot suggestion or a question? Reach out through any of these:</p>
      <ul>
        <li>Email: tupmfoodspots@example.com</li>
        <li>Instagram: @tupmfoodspots</li>
      </ul>
      <form>
  <fieldset>
    <legend>Your details</legend>

    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="subject">Subject</label>
    <select id="subject" name="subject">
      <option value="suggest-place">Suggest a place</option>
      <option value="correct-detail">Correct a detail</option>
      <option value="ask-question">Ask a question</option>
      <option value="other">Something else</option>
    </select>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" required></textarea>

    <button type="submit">Send message</button>
  </fieldset>
</form>
    </section>
  </main>

  <footer>
    <p><a href="https://jangel-laureta-compro.github.io/laureta_johnangel/">Back to Main Site</a></p>
  </footer>

</body>
</html>
